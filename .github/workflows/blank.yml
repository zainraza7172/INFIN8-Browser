name: Build INFIN8 Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          echo "Using SDK Manager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --channel=3 \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      - name: Extract INFIN8 Browser Source
        run: |
          unzip -q INFIN8Browser-v0.1-source.zip

          echo "Project extracted:"
          ls -la INFIN8Browser

      - name: Build Debug APK
        working-directory: INFIN8Browser
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFIN8-Browser-APK
          path: INFIN8Browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
