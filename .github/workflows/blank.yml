name: Build INFIN8 Browser v2.5 APK + AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable INFIN8 debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: infin8-browser-debug-keystore-v1

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract INFIN8 Browser v2.5
        run: |
          rm -rf INFIN8Browser
          unzip -q INFIN8Browser-v2.5-source.zip
          test -f INFIN8Browser/app/build.gradle.kts
          echo "INFIN8 Browser v2.5 source extracted"

      - name: Prepare optional production signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.INFIN8_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INFIN8_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INFIN8_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INFIN8_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/infin8-release.jks"
            echo "INFIN8_KEYSTORE_PATH=$RUNNER_TEMP/infin8-release.jks" >> "$GITHUB_ENV"
            echo "INFIN8_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "INFIN8_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "INFIN8_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "INFIN8_RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "Production signing secrets detected"
          else
            echo "INFIN8_RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "Production signing secrets are not fully configured; release outputs will remain unsigned"
          fi

      - name: Build test APK + release APK + release AAB
        working-directory: INFIN8Browser
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Stage release outputs and checksums
        shell: bash
        run: |
          mkdir -p release-out
          cp INFIN8Browser/app/build/outputs/bundle/release/app-release.aab release-out/INFIN8-Browser-v2.5-release.aab
          if [ -f INFIN8Browser/app/build/outputs/apk/release/app-release.apk ]; then
            cp INFIN8Browser/app/build/outputs/apk/release/app-release.apk release-out/INFIN8-Browser-v2.5-release-signed.apk
            echo "SIGNED=true" > release-out/signing-status.txt
          else
            cp INFIN8Browser/app/build/outputs/apk/release/app-release-unsigned.apk release-out/INFIN8-Browser-v2.5-release-unsigned.apk
            echo "SIGNED=false" > release-out/signing-status.txt
          fi
          echo "GitHub secret signing requested: ${INFIN8_RELEASE_SIGNED:-false}" >> release-out/signing-status.txt
          (cd release-out && sha256sum * > SHA256SUMS.txt)

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: INFIN8-Browser-v2.5-APK
          path: INFIN8Browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK + AAB + checksums
        uses: actions/upload-artifact@v4
        with:
          name: INFIN8-Browser-v2.5-RELEASE
          path: release-out/*
          if-no-files-found: error
