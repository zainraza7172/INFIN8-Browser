name: Build INFIN8 Browser v1.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Keep one stable debug signing key from v1.5 onward.
      # This lets future APKs install as updates instead of forcing an uninstall,
      # so tabs, bookmarks, settings and the one-time welcome flag are preserved.
      - name: Restore stable INFIN8 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: infin8-browser-debug-keystore-v1

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract INFIN8 Browser v1.5
        run: |
          rm -rf INFIN8Browser
          unzip -q INFIN8Browser-v1.5-source.zip
          test -f INFIN8Browser/app/build.gradle.kts
          echo "INFIN8 Browser v1.5 source extracted"

      - name: Build Debug APK
        working-directory: INFIN8Browser
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFIN8-Browser-v1.5-APK
          path: INFIN8Browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
