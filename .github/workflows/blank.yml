name: Build INFIN8 Browser APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract INFIN8 Browser
        run: |
          rm -rf INFIN8Browser
          unzip -q INFIN8Browser-v0.1-source.zip

          echo "Project extracted"
          ls -la INFIN8Browser

      - name: Change project to stable API 36
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' INFIN8Browser/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' INFIN8Browser/app/build.gradle.kts

          echo "Updated Gradle:"
          cat INFIN8Browser/app/build.gradle.kts

      - name: Build Debug APK
        working-directory: INFIN8Browser
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INFIN8-Browser-APK
          path: INFIN8Browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
